name: Release

on:
  push:
    branches: [main]

# One release at a time; a second push waits rather than racing the first.
concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that reads NODE_AUTH_TOKEN below.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Pending changesets -> opens/updates the "Version Packages" PR.
      # No pending changesets (i.e. that PR just merged) -> runs `publish`.
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # One GitHub release per published package, and the API marks whichever
      # was created last as "Latest" — alphabetical luck, which had icons-svg
      # holding the sidebar. The five stay; the badge moves to the package the
      # repo is named for. A publish that did not include it is left alone.
      - name: Point the Latest badge at @devigner-ui/icons
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          tag=$(node -e '
            const main = JSON.parse(process.env.PUBLISHED)
              .find((pkg) => pkg.name === "@devigner-ui/icons");
            if (main) console.log(`${main.name}@${main.version}`);
          ')

          # A publish that bumped only a port has already taken the badge by
          # now, so there is nothing to leave alone: fall back to the newest
          # release this package has. The `@` in the prefix is what keeps
          # `@devigner-ui/icons-svg@2.1.0` from matching.
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName \
              -q '[.[] | select(.tagName | startswith("@devigner-ui/icons@"))] | .[0].tagName')
          fi

          if [ -z "$tag" ]; then
            echo "No @devigner-ui/icons release exists yet; nothing to pin."
            exit 0
          fi

          echo "Pinning $tag as the latest release."
          gh release edit "$tag" --latest --repo "$GITHUB_REPOSITORY"
