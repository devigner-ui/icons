name: Release

on:
  push:
    branches: [main]

# One release at a time; a second push waits rather than racing the first.
concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that reads NODE_AUTH_TOKEN below.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Pending changesets -> opens/updates the "Version Packages" PR.
      # No pending changesets (i.e. that PR just merged) -> runs `publish`.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
